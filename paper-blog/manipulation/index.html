  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const navbar = document.querySelector('.navbar-custom');
    
    
    document.body.classList.add('fade-in');
    
    
    const cardList = document.querySelector('.card-article-list');
    if (cardList) {
      cardList.classList.add('fade-in-delay-1');
    }
    
    const navbarElement = document.querySelector('.navbar-custom');
    if (navbarElement) {
      navbarElement.classList.add('fade-in-delay-2');
    }
    
    
    window.addEventListener('scroll', function() {
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });
    
    
    const links = document.querySelectorAll('a[href^="/"]:not([href*="#"])');
    links.forEach(link => {
      link.addEventListener('click', function(e) {
        if (!this.closest('.navbar-custom')) {
          document.body.classList.add('fade-out');
        }
      });
    });
    
    
    const tocItems = document.querySelectorAll('.toc-item');
    const sections = document.querySelectorAll('.article-card');
    
    
    window.addEventListener('scroll', function() {
      let current = '';
      const scrollPosition = window.scrollY + 150; 
      
      sections.forEach(section => {
        const sectionTop = section.offsetTop;
        const sectionHeight = section.offsetHeight;
        
        if (scrollPosition >= sectionTop && scrollPosition < sectionTop + sectionHeight) {
          current = section.getAttribute('id');
        }
      });
      
      
      tocItems.forEach(item => {
        item.classList.remove('active');
        if (item.getAttribute('href') === '#' + current) {
          item.classList.add('active');
        }
      });
    });
    
    
    tocItems.forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href').substring(1);
        const targetSection = document.getElementById(targetId);
        
        if (targetSection) {
          targetSection.scrollIntoView({ behavior: 'smooth' });
          
          
          tocItems.forEach(tocItem => tocItem.classList.remove('active'));
          this.classList.add('active');
        }
      });
    });
  });
  </script>
