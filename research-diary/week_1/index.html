  <style>
    .password-protection {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: 2rem;
      background: linear-gradient(135deg, #f5f7fa 0%,#81b29a 100%);
      border-radius: 15px;
      margin: 2rem 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    
    .password-protection h2 {
      color: #2c3e50;
      margin-bottom: 1.5rem;
      font-size: 2rem;
      font-weight: 600;
    }
    
    .password-protection p {
      color: #34495e;
      margin-bottom: 2rem;
      font-size: 1.1rem;
      line-height: 1.6;
      max-width: 600px;
    }
    
    .password-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
    }
    
    .password-input {
      padding: 12px 16px;
      border: 2px solid #e0e6ed;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: white;
    }
    
    .password-input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }
    
    .password-submit {
      padding: 12px 24px;
      background: linear-gradient(135deg, #faf9ec 0%, #f2cc8f 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .password-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    
    .password-submit:active {
      transform: translateY(0);
    }
    
    .password-error {
      color: #e74c3c;
      margin-top: 1rem;
      font-weight: 500;
      display: none;
    }
    
    .password-success {
      color: #81b29a;
      margin-top: 1rem;
      font-weight: 500;
      display: none;
    }
    
    .content-hidden {
      display: none;
    }
    
    .content-visible {
      display: block;
    }
    
    .lock-icon {
      font-size: 3rem;
      color: #7f8c8d;
      margin-bottom: 1rem;
    }
  </style>
  
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const navbar = document.querySelector('.navbar-custom');
    
    
    document.body.classList.add('fade-in');
    
    
    const diaryContent = document.querySelector('.diary-content');
    if (diaryContent) {
      diaryContent.classList.add('fade-in-delay-1');
    }
    
    const navbarElement = document.querySelector('.navbar-custom');
    if (navbarElement) {
      navbarElement.classList.add('fade-in-delay-2');
    }
    
    
    window.addEventListener('scroll', function() {
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });
    
    
    const links = document.querySelectorAll('a[href^="/"]:not([href*="#"])');
    links.forEach(link => {
      link.addEventListener('click', function(e) {
        if (!this.closest('.navbar-custom')) {
          document.body.classList.add('fade-out');
        }
      });
    });
    
    
    const passwordForm = document.querySelector('.password-form');
    if (passwordForm) {
      passwordForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const input = this.querySelector('.password-input');
        const userAnswer = input.value.trim();
        const correctAnswer = '';
        const errorMsg = document.querySelector('.password-error');
        const successMsg = document.querySelector('.password-success');
        const content = document.querySelector('.diary-content');
        const passwordProtection = document.querySelector('.password-protection');
        
        if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
          
          errorMsg.style.display = 'none';
          successMsg.style.display = 'block';
          successMsg.textContent = '密码正确！正在显示内容...';
          
          
          setTimeout(() => {
            passwordProtection.style.display = 'none';
            content.classList.remove('content-hidden');
            content.classList.add('content-visible');
            
            
            const toc = document.querySelector('.diary-toc');
            if (toc) {
              toc.classList.remove('content-hidden');
            }
            
            
            if (window.MathJax) {
              window.MathJax.typeset();
            }
          }, 1000);
        } else {
          
          errorMsg.style.display = 'block';
          errorMsg.textContent = '答案不正确，请重试';
          input.value = '';
          input.focus();
        }
      });
    }
    

    
    
    const tocItems = document.querySelectorAll('.toc-item');
    const sections = document.querySelectorAll('.content-section');
    
    
    window.addEventListener('scroll', function() {
      let current = '';
      const scrollPosition = window.scrollY + 150; 
      
      sections.forEach(section => {
        const sectionTop = section.offsetTop;
        const sectionHeight = section.offsetHeight;
        
        if (scrollPosition >= sectionTop && scrollPosition < sectionTop + sectionHeight) {
          current = section.getAttribute('id');
        }
      });
      
      
      tocItems.forEach(item => {
        item.classList.remove('active');
        if (item.getAttribute('href') === '#' + current) {
          item.classList.add('active');
        }
      });
    });
    
    
    tocItems.forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href').substring(1);
        const targetSection = document.getElementById(targetId);
        
        if (targetSection) {
          targetSection.scrollIntoView({ behavior: 'smooth' });
          
          
          tocItems.forEach(tocItem => tocItem.classList.remove('active'));
          this.classList.add('active');
        }
      });
    });
  });
  </script>
